name: Check

on:
  push:
    branches: [main, develop]
  pull_request:
  # On demand, from the Actions tab. The suite has two reasons to be re-run
  # without a new commit: an intermittent test (F29 permutes whole batches
  # under load and needs several runs to judge) and a job that has never run
  # green anywhere, which you want to retry after fixing the runner, not
  # after inventing a commit.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc -b
      # Vitest with the coverage thresholds in vitest.config.ts as the gate.
      - run: npm run test:coverage
      # Every `t("…")` in the sources has an entry in all four locales, and no
      # locale carries a key nothing asks for (scripts/sync-translations.mjs).
      - run: npm run translations:check
      # F22: initial and first-screen JS budgets, and no recharts/turndown/he
      # in the first screen (scripts/check-bundle.mjs).
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-ui
          path: coverage/lcov.info
          if-no-files-found: ignore

  resolve-api:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY || 'cq-dropchat/dropchat-api' }}
          ref: ${{ github.head_ref || github.ref_name }}
          path: open-bsp-api
        continue-on-error: true
        id: paired
      - uses: actions/checkout@v4
        if: steps.paired.outcome == 'failure'
        with:
          repository: ${{ vars.API_REPOSITORY || 'cq-dropchat/dropchat-api' }}
          ref: main
          path: open-bsp-api
      - id: revision
        run: echo "sha=$(git -C open-bsp-api rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  types-sync:
    needs: resolve-api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-bsp-ui
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY || 'cq-dropchat/dropchat-api' }}
          ref: ${{ needs.resolve-api.outputs.sha }}
          path: open-bsp-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: open-bsp-ui/package-lock.json
      - run: cd open-bsp-ui && npm ci
      - run: cd open-bsp-ui && npm run types:sync-check
        env:
          API_REPO_DIR: ../open-bsp-api

  # Playwright flows on every PR against the paired local API and real DB.
  # `workflow_dispatch` counts as one of those: it runs on the branch you pick
  # in the Actions tab, and a manual re-run that silently dropped the one job
  # with a history of being red would be worse than no re-run.
  e2e:
    needs: [resolve-api, types-sync]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-bsp-ui
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY || 'cq-dropchat/dropchat-api' }}
          ref: ${{ needs.resolve-api.outputs.sha }}
          path: open-bsp-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: cd open-bsp-api && supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime
      - run: cd open-bsp-api && docker exec -i supabase_db_open-bsp-api psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/seed_test.sql
      # The local stack's anon key is a fixed demo JWT that `supabase start`
      # mints identically on every machine — the stack it opens is this
      # runner's throwaway container, so it guards nothing and belongs to no
      # project. It was read from a `LOCAL_SUPABASE_ANON_KEY` repository
      # variable that nobody ever set, which is why this job has been red
      # since it landed: Playwright started against a client built with an
      # empty key. Ask the CLI that just printed it instead.
      - name: Read the local anon key
        run: |
          cd open-bsp-api
          supabase status -o env \
            | sed -n 's/^ANON_KEY="\(.*\)"$/VITE_SUPABASE_ANON_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: cd open-bsp-ui && npm ci && npx playwright install --with-deps chromium
      - run: cd open-bsp-ui && npm run e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
      - name: Record tested immutable pair
        run: |
          mkdir -p open-bsp-ui/artifacts/release
          API_SHA=$(git -C open-bsp-api rev-parse HEAD)
          UI_SHA=$(git -C open-bsp-ui rev-parse HEAD)
          printf '{"api_sha":"%s","ui_sha":"%s"}\n' "$API_SHA" "$UI_SHA" > open-bsp-ui/artifacts/release/pair.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-pair-${{ github.sha }}
          path: open-bsp-ui/artifacts/release/pair.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            open-bsp-ui/playwright-report
            open-bsp-ui/test-results
      - if: always()
        run: cd open-bsp-api && supabase stop --no-backup

  # F25 pedía un job `promotion` acá: fallar cualquier pull request hacia
  # `main` que no viniera de `develop`, porque `main` es producción y los
  # cambios tenían que llegar promovidos desde una rama ya desplegada a DEV y
  # probada. Se quitó el 22/09, y no por estar de más sino porque **nada de
  # eso existe**: `develop` no está en el repo, no hay variables ni
  # environments configurados en ninguno de los dos —ni `SUPABASE_PROJECT_ID`
  # ni los `Production`/`Staging` que `release.yml` declara—, así que una rama
  # `develop` no desplegaría a ningún lado y no habría nada que promover.
  #
  # Mientras estuvo, no protegía: el flujo real es rama por ítem, merge local
  # y push, así que el job no se disparaba nunca (`skipped` en las tres
  # corridas del 21/09). Lo que sí hacía era **bloquear la protección de
  # rama**: al exigir PR para entrar a `main`, todo PR habría chocado contra
  # él, porque ninguno viene de una rama que no existe.
  #
  # Para traerlo de vuelta hace falta, en este orden: un proyecto de Supabase
  # para DEV, la rama `develop` apuntada a él, y recién entonces el gate.
