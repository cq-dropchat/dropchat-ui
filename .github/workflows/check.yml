name: Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc -b
      # Vitest with the coverage thresholds in vitest.config.ts as the gate.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-ui
          path: coverage/lcov.info
          if-no-files-found: ignore

  # One Playwright flow against a local Supabase + `vite preview`. Only on the
  # long-lived branches: it needs the API repo checked out beside this one.
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-bsp-ui
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY || 'openbsp/open-bsp-api' }}
          ref: ${{ github.ref_name }}
          path: open-bsp-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: cd open-bsp-api && supabase start -x studio,imgproxy,inbucket,logflare,vector
      - run: cd open-bsp-ui && npm ci && npx playwright install --with-deps chromium
      - run: cd open-bsp-ui && npm run e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ vars.LOCAL_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: open-bsp-ui/playwright-report
      - if: always()
        run: cd open-bsp-api && supabase stop --no-backup
