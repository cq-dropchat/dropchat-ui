name: Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc -b
      # Vitest with the coverage thresholds in vitest.config.ts as the gate.
      - run: npm run test:coverage
      # F22: initial and first-screen JS budgets, and no recharts/turndown/he
      # in the first screen (scripts/check-bundle.mjs).
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-ui
          path: coverage/lcov.info
          if-no-files-found: ignore

  # F29: the hand-written types and db_types.ts mirror the API repository's.
  # Fails on drift not recorded in scripts/type-sync.baseline (see the script).
  types-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-bsp-ui
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY || 'openbsp/open-bsp-api' }}
          # The API branch of the same name when it exists (a paired change),
          # otherwise the API's develop.
          ref: ${{ github.head_ref || github.ref_name }}
          path: open-bsp-api
        continue-on-error: true
        id: api-same-branch
      - uses: actions/checkout@v4
        if: steps.api-same-branch.outcome == 'failure'
        with:
          repository: ${{ vars.API_REPOSITORY || 'openbsp/open-bsp-api' }}
          ref: develop
          path: open-bsp-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: open-bsp-ui/package-lock.json
      - run: cd open-bsp-ui && npm ci
      - run: cd open-bsp-ui && npm run types:sync-check
        env:
          API_REPO_DIR: ../open-bsp-api
      # §5.2: the UI's toV1 against the fixture the API's backfill is checked with.
      - run: cd open-bsp-ui && npx vitest run scripts/messages-v0.fixtures.test.mjs
        env:
          API_REPO_DIR: ../open-bsp-api

  # One Playwright flow against a local Supabase + `vite preview`. Only on the
  # long-lived branches: it needs the API repo checked out beside this one.
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-bsp-ui
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY || 'openbsp/open-bsp-api' }}
          ref: ${{ github.ref_name }}
          path: open-bsp-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: cd open-bsp-api && supabase start -x studio,imgproxy,inbucket,logflare,vector
      - run: cd open-bsp-ui && npm ci && npx playwright install --with-deps chromium
      - run: cd open-bsp-ui && npm run e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ vars.LOCAL_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: open-bsp-ui/playwright-report
      - if: always()
        run: cd open-bsp-api && supabase stop --no-backup

  # F25: main deploys to production (Cloudflare Pages). It only receives
  # develop; pair with branch protection on main.
  promotion:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: main only accepts develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (got '${{ github.head_ref }}')."
            exit 1
          fi
