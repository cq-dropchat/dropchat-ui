<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#cb6441" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />

    <title>OpenBSP - Open-source WhatsApp Web and Instagram interface</title>
    <meta
      name="description"
      content="Open-source WhatsApp Web and Instagram interface. Self-hostable, multi-tenant, and AI-agent ready."
    />

    <!-- Open Graph (used by WhatsApp, Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenBSP" />
    <meta property="og:url" content="https://web.openbsp.dev/" />
    <meta
      property="og:title"
      content="OpenBSP - Open-source WhatsApp Web and Instagram interface"
    />
    <meta
      property="og:description"
      content="Open-source WhatsApp Web and Instagram interface. Self-hostable, multi-tenant, and AI-agent ready."
    />
    <meta
      property="og:image"
      content="https://web.openbsp.dev/logo-512x512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="OpenBSP logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="OpenBSP - Open-source WhatsApp Web and Instagram interface"
    />
    <meta
      name="twitter:description"
      content="Open-source WhatsApp Web and Instagram interface. Self-hostable, multi-tenant, and AI-agent ready."
    />
    <meta
      name="twitter:image"
      content="https://web.openbsp.dev/logo-512x512.png"
    />
    <!--
      F22: start the locale request now, in parallel with the scripts, instead
      of after the entry bundle has run (main.tsx awaits it before mounting).
      Mirrors detectLanguage in main.tsx; translations.ts reuses the request
      only when the languages match.
    -->
    <script>
      (function () {
        var supported = ["es", "en", "pt", "sw", "fr"];
        var lang;
        try {
          var stored = JSON.parse(localStorage.getItem("app-state") || "{}");
          lang = stored.state && stored.state.ui && stored.state.ui.language;
        } catch (e) {}
        if (!lang) {
          var tags = (navigator.languages || []).concat(
            navigator.language || [],
          );
          for (var i = 0; i < tags.length && !lang; i++) {
            var base = String(tags[i]).toLowerCase().split("-")[0];
            if (supported.indexOf(base) !== -1) lang = base;
          }
        }
        lang = lang || "en";
        if (lang !== "es") {
          var response = fetch("/locales/" + lang + ".json");
          // Handled by translations.ts; this only keeps an unused failed
          // request from surfacing as an unhandled rejection.
          response.catch(function () {});
          window.__earlyLocale = { lang: lang, response: response };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
